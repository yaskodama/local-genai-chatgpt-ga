<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ABCL/c+ 5 Philosophers Visualization</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #ddd;
                 font-family: sans-serif; }
    #root { display: flex; height: 100vh; }
    #srcPanel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #vizPanel { flex: 0 0 560px; display: flex; flex-direction: column;
                border-left: 1px solid #333; }
    #canvasBox { flex: 1; display: flex; align-items: center; justify-content: center;
                 background: #050510; }
    canvas { background: #0a0a1a; border: 1px solid #333; }
    #controls { padding: 10px; background: #1a1a1a; border-top: 1px solid #333;
                display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #controls button { padding: 6px 10px; background: #333; color: #fff;
                       border: 1px solid #555; cursor: pointer; }
    #controls button:hover { background: #444; }
    #btnStart { background: #264; color: #cfc; border-color: #4a8; }
    #btnStop  { background: #622; color: #fcc; border-color: #a44; }
    #status { margin-left: 12px; color: #8f8; font-family: monospace; }
    #logBox { height: 400px; overflow: auto; padding: 8px; background: #000; color: #9cf;
              font-family: monospace; font-size: 12px; border-top: 1px solid #333;
              white-space: pre-wrap; }
    h3 { margin: 0; padding: 8px 10px; background: #1a1a1a; border-bottom: 1px solid #333;
         font-size: 13px; color: #bbb; }
    #srcText { flex: 1; margin: 0; padding: 10px; background: #000; color: #0f0;
               font-family: monospace; font-size: 12px; white-space: pre; overflow: auto; }
  </style>
</head>
<body>
  <div id="root">
    <div id="srcPanel">
      <h3>ABCL/c+ source: src/viz_philosophers.abcl</h3>
      <pre id="srcText">(loading...)</pre>
    </div>
    <div id="vizPanel">
      <h3>Visualization — 5 Dining Philosophers</h3>
      <div id="canvasBox">
        <canvas id="canvas" width="500" height="500"></canvas>
      </div>
      <div id="controls">
        <button id="btnLoad">Load abcl</button>
        <button id="btnCompile">Compile</button>
        <button id="btnStart">Start</button>
        <button id="btnStop">Stop</button>
        <button id="btnReset">Reset Display</button>
        <span id="status">ready</span>
      </div>
      <div id="logBox"></div>
    </div>
  </div>
  <script src="/viz_philosophers.js"></script>
</body>
</html>
